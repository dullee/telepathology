[project]
name = "telepath-backend"
version = "0.1.0"
description = "Edge telepathology triage engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "torch>=2.3",
    "torchvision>=0.18",
    "tiatoolbox>=1.6",
    "pillow>=10",
    "numpy>=1.26",
    "scipy>=1.12",
    "httpx>=0.27",
    "remotezip>=0.12.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# On the clinic's Windows/Linux box, pull CUDA builds so the RTX 4060 is used.
# macOS uses the default PyPI wheels (MPS / CPU).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
